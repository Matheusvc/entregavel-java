spring.application.name=aula2

# ===== Conexão com o PostgreSQL =====
# Ajuste o nome do banco, o usuario e a SENHA conforme o seu PostgreSQL.
# Crie o banco antes de rodar:  CREATE DATABASE escola_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/escola_db
spring.datasource.username=postgres
spring.datasource.password=Math0702
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Propriedades do Hibernate / JPA =====
# update: o Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# show-sql: mostra no console os comandos SQL que o Hibernate executa
spring.jpa.show-sql=true
# formata o SQL no console para ficar mais legivel
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
